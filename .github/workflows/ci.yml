name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Smoke (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["20", "22", "24", "26"]
        include:
          - os: macos-latest
            node: "22"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm install

      # The full test suite calls Spotify's public API and is occasionally
      # flaky depending on what Spotify returns. CI verifies that the module
      # loads and that the CLI actually runs, which needs no network.
      - name: Module loads
        run: node -e "const a = require('./'); if (typeof a !== 'function') process.exit(1)"

      # Run the real bin. Checking only that the file exists let a crashing
      # CLI ship (meow is ESM-only, so `require` returned a namespace object).
      - name: CLI runs
        run: |
          BIN=$(node -p "require('./package.json').bin['album-art']")
          node "$BIN" --help
          test "$(node "$BIN" --version)" = "$(node -p "require('./package.json').version")"
